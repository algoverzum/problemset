---
- "Két mohó stratégiát lehet megvalósítani:\na) Az egyik napok szerint halad, az adott napon érkező összes igényt próbálja kiszolgálni tetszőleges sorrendben.\nb) A másik az igények szerint halad (előtte rendezve a foglalási igényeket kezdőnap szerint növekvő sorrendben), és mindig a legkorábban felszabaduló faházat választja."
- "a) Érdemes megszámolni, hogy az év egyes napjain hány foglalási igény érkezik. Mivel a napok száma legfeljebb 365, használhatunk egy tömböt, ahol az $i$-edik elem az $i$-edik napon kezdődő foglalások számát tárolja.\nb) Egy új foglalási igény elbírálásához azt kell eldönteni, hogy van-e olyan faház, amely a vendég érkezésekor már szabad."
- "a) Minden faházhoz tároljuk el, hogy legközelebb melyik napon lesz újra szabad. Kezdetben minden faház azonnal foglalható.\nb) Mindig azt a faházat vizsgáljuk először, amelyik a leghamarabb válik szabaddá."
- "a) Haladjunk végig az év napjain növekvő sorrendben! Ha egy adott napon érkezik foglalási igény, keressünk olyan faházat, amely ezen a napon már szabad. Ha találunk szabad faházat, akkor elfogadhatjuk a foglalást. A faház következő szabad napja ekkor a foglalás kezdőnapja után $M$ nappal lesz.\nb) Ha több faház közül választhatunk, elegendő azt vizsgálni, amelyik a leghamarabb szabadul fel. Ha ez sem szabad még, akkor egyik másik faház sem lesz megfelelő."
