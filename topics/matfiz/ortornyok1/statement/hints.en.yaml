---
- "Use a Boolean matrix (`bool forbidden[MAX][MAX]`) to record which pairs of towers cannot be selected together. Store the tower indices in the current guard assignment in `vector<int> current`, and store all complete guard assignments in `vector<vector<int>> solutions`."
- "Write a function (`canAdd`) that checks whether tower `idx` can be added to the current subset. Iterate over the elements of `current` and return false if `forbidden[idx][t]` is true for any selected tower `t`; otherwise, return true."
- "In the `backtrack` function, decide whether to include each tower. There are two branches: include tower `idx` (if allowed), or exclude it. When `idx > N`, every tower has been considered, so the current subset is a complete guard assignment."
- "In the first branch, use `if (canAdd(idx))` to check whether tower `idx` can be selected. If so, add it to `current`, call `backtrack(idx + 1)`, and then remove it from `current`. In the second branch, exclude tower `idx` and call `backtrack(idx + 1)`."
- "This traversal does not generate the solutions in lexicographical order (for example, `[1, 3]` is generated before `[1]`), so sort `solutions` at the end using `sort`. After sorting, the empty guard assignment will automatically come first."
