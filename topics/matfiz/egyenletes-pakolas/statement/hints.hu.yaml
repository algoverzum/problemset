---
- 'Ez a probléma a klasszikus "minimális maximum részösszeg" (minimax partitioning) probléma. Adott N számot K darab csoportra kell osztanunk (egymást követő elemekből), hogy a csoportösszegek maximuma minimális legyen. A megoldás: paraméteres keresés (bináris keresés) a maximális terhelésre.'
- 'A bináris keresés alsó határa a legnagyobb egyedi konténer súlya (mert egy kamion legalább egy konténert visz). A felső határa az összes konténer összsúlya (ha mindet egy kamion vinné).\nA bináris keresés minden lépésében egy eldöntési függvényt (predikátumot) kell meghívnunk, ami megmondja, hogy egy adott X maximális terhelés mellett be lehet-e osztani a konténereket legfeljebb K kamionba.'
- 'Az eldöntési függvény mohó: haladjunk balról jobbra, és pakoljuk a konténereket az aktuális kamionba, amíg az összsúly nem haladja meg X-et. Ha túllépnénk, indítsunk új kamiont. A végén megnézzük, hogy a felhasznált kamionok száma <= K-e.\nHa a mohó K-nál több kamiont használ, akkor X túl kicsi (növelni kell). Ha K-nál nem többet, akkor X jó (lehet csökkenteni).'
- 'A második kimeneti sor (a kezdő indexek) előállításához a bináris keresés után, a megtalált optimális X értékkel újra le kell futtatnunk a mohó algoritmust, és közben elmenteni az egyes kamionok kezdő indexeit.'
