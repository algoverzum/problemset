---
- "Érdemes saját struktúrát használni az igények tárolására. Gondoljuk végig a klasszikus intervallum-ütemezési feladatot: mi alapján érdemes sorba rendezni az igényeket, ha a legtöbbet szeretnénk elvállalni? (Segítség: a legkorábban véget érő igények hagynak legtöbb helyet a többinek.)"
- "Rendezzük az igényeket a felszabadulási napjuk (t_i + h_i) szerint növekvő sorrendbe! Így a mohó stratégia elve szerint haladhatunk végig rajtuk: minden igényt elfogadunk, ha van számára szabad faház."
- "Mivel K darab faházunk van, egyszerre több igény is futhat. Nem kell mind a K faház állapotát külön ciklussal ellenőrizni, mert az túl lassú lenne. Elég a faházak felszabadulási napjait egy rendezett adatszerkezetben tárolni."
- "Ha több faház is szabad az igény kezdőnapján, **nem mindegy, melyiket választjuk!** Ne a legkorábban felszabaduló faházat foglaljuk el, hanem azt, amelyik **a legkésőbb szabadult fel, de legkésőbb a kezdőnapon**. A korán felszabaduló faházat érdemes megtartani egy későbbi, de korábban kezdődő igénynek.\nEllenpélda a „legkorábban felszabaduló” választásra ($K = 2$): az igények `1 1`, `1 4`, `6 1`, `3 5`. Ha a `6 1` igény a 2. napon felszabaduló faházat kapja, a `3 5` már nem fér be (eredmény: 3). Ha az 5. napon felszabadulót kapja, mind a 4 igény teljesíthető."
- python: "Tartsuk nyilván egy listában a már használt faházak felszabadulási napjait, a még érintetlen faházakat pedig egy számlálóval (kezdetben $K$). Mivel az igényeket végnap szerint növekvő sorrendben dolgozzuk fel, az új végnap mindig a lista végére kerül, így a lista magától rendezett marad.\nEgy $(t, h)$ igény feldolgozása:\n* Bináris kereséssel keressük meg a lista utolsó olyan elemét, amely legfeljebb $t$ (ez a legkésőbb felszabaduló, de már szabad faház).\n* Ha van ilyen: vegyük ki a listából, tegyük a lista végére a $t + h$ értéket, és növeljük a számlálót.\n* Ha nincs, de van még érintetlen faház: csökkentsük az érintetlen faházak számát, tegyük a lista végére a $t + h$ értéket, és növeljük a számlálót.\n* Különben az igényt elutasítjuk."
  cpp: "Tároljuk a felszabadulási napokat egy rendezett multihalmazban (C++-ban `std::multiset`), kezdetben K darab 0 értékkel (üres faházak). Egy (t, h) igény feldolgozásakor keressük meg a legnagyobb, $t$-nél nem nagyobb elemet (`upper_bound(t)`, majd egy lépés vissza). Ha van ilyen, vegyük ki, tegyük be helyette a $t + h$ értéket, és növeljük a számlálót; ha nincs, az igényt elutasítjuk. Pythonban ugyanez egy Fenwick-fával (a napokon felszabaduló faházak darabszámával) oldható meg. A futási idő O(N log N)."
