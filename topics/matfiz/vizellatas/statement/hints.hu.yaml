---
- Ha minden falu ellátható K darab R hatósugarú állomással, akkor bármely R' > R hatósugárral is biztosan elláthatóak. Ha viszont egy R hatósugár túl kicsi, akkor annál kisebbel sem fog sikerülni. Ezért a minimális R-re binárisan kereshetünk.
- Ha egy állomás hatósugara R, akkor az állomástól balra és jobbra is legfeljebb R távolságra lévő falvakat tudja ellátni. Ez azt jelenti, hogy egyetlen állomással lefedett legszélső falvak (a legbaloldalibb \(a_{l}\) és a legjobboldalibb \(a_{r}\)) közötti távolság legfeljebb 2R lehet (\(a_r - a_l <= 2R\)). Ha ez teljesül, mindig létezik olyan falu a kettő között (vagy maga az egyik végpont), ahová az állomást letéve mindkettőt (és a köztük lévőket is) eléri.
- Induljunk el a legelső (legbaloldalibb) ellátatlan falutól (\(a_{l}\)). Keressük meg azt a legtávolabbi \(a_{r}\) falut, amire még igaz, hogy \(a_r - a_l <= 2R\). Ekkor az \([l, r]\) intervallum falvait egyetlen állomással lefedhetjük. Ezután a következő állomást a még lefedetlen, soron következő első falutól indítjuk, és ezt ismételjük.
- A hatósugár legkisebb értéke 0 lehet (ha K >= N). A maximális értéke pedig a legelső és legutolsó falu távolságának a fele (\(a_N - a_1\)).
