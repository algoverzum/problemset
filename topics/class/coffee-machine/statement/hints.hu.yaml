---
- cpp: |
    A konstruktorban állítsd be a márkát, és inicializáld az adattagokat:
    `is_on = false;`
    `water_ml = 0;`
    `coffee_g = 0;`
  py: |
    A konstruktorban mentsd el a márkát, és állítsd be:
    `self.__is_on = False`
    `self.__water_ml = 0`
    `self.__coffee_g = 0`
- cpp: |
    A `set_electricity()` függvény a kapott értéket mentse el az `is_on` adattagba.
  py: |
    A `set_electricity()` metódus a kapott értéket mentse el a `__is_on` adattagba.
- cpp: |
    Az `add_water()` függvény növelje a vízmennyiséget: `water_ml += amount;`
  py: |
    Az `add_water()` metódus növelje a vízmennyiséget: `self.__water_ml += amount`
- cpp: |
    Az `add_coffee()` függvény növelje a kávémennyiséget.
  py: |
    Az `add_coffee()` metódus növelje a kávémennyiséget.
- Kávét csak akkor lehet főzni, ha a gép be van kapcsolva, van legalább 50 ml víz és legalább 15 g kávé.
- Sikeres kávéfőzéskor vonj le 50 ml vizet és 15 g kávét a készletből.
- cpp: |
    A `brew_coffee()` visszatérési típusa `bool`.
    Siker esetén `true`, egyébként `false` értéket adj vissza.
  py: |
    A `brew_coffee()` siker esetén `True`, egyébként `False` értékkel térjen vissza.
- |
  A `get_status()` egyetlen stringet adjon vissza, amely tartalmazza a márkát, a bekapcsolt állapotot ("ON" vagy "OFF"), a víz mennyiségét (ml) és a kávé mennyiségét (g). Pl.: "ABC ON 100ml 5g"-t ha a márkája ABC, be van kapcsolva, 100 ml víz van benne és 5 g kávé.
- cpp: |
    A logikai értékből készíthetsz "ON"/"OFF"-ot: `is_on ? "ON" : "OFF"`
  py: |
    A logikai értékből készíthetsz "ON"/"OFF"-ot: `"ON" if self.__is_on else "OFF"`
