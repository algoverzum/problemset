---
- First, reduce the fraction ($P/Q$) by dividing both the numerator and denominator by their greatest common divisor (gcd).
- After reduction, the denominator of a valid Elf ratio must always be a power of 2. If the denominator is not a power of 2, then the given ratio cannot occur, so the answer is "impossible". (Initially, every ancestor is either $0/1$ (Human) or $1/1$ (Elf). If two ancestors have ratios $A/2^n$ and $B/2^{n+m}$, then their child has ratio $\frac{A\cdot 2^m+B}{2^{n+m+1}}$, which remains of the form $C/2^k$ even after reduction.)
- Suppose that in the reduced fraction, $Q$ is a power of 2. The remaining task is to determine how close the nearest full Elf ($1/1$) ancestor could have been.
- If we move backward through the family tree, a person with ratio $P/Q$ can have a parent whose Elf ratio is as large as $2P/Q$ (since a child of $2P/Q$ and $0/Q$ has ratio $P/Q$). Therefore, when moving back one generation, the numerator can at most double. To reach a full Elf ($Q/Q$) as quickly as possible, we should always choose this maximum increase. Therefore, repeatedly double $P$ until it becomes greater than or equal to $Q$. The number of doublings is the minimum number of generations.
